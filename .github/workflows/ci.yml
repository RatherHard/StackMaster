name: CI

# 阶段二 WP-0:TS 门禁 + vm-engine 确定性纪律门禁(阶段一移交项接线)。
# 步骤名携带《数据分类与秘密零驻留清单》条目 ID(扫描器纪律,§九);
# 条目 → CI 检查项映射:docs/develop/秘密零驻留CI检查项映射.md。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-gate:
    name: TS 构建图与契约门禁(ZR-B3 / ZR-B9 隔离扫描)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖(frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 构建 + 类型检查 + 测试(turbo)
        run: |
          set -o pipefail
          mkdir -p .tmp
          pnpm build 2>&1 | tee -a .tmp/ts-gate.log
          pnpm typecheck 2>&1 | tee -a .tmp/ts-gate.log
          pnpm test 2>&1 | tee -a .tmp/ts-gate.log
      # ── 失败摘要 → **公开注解**(免凭证可读;仅在失败时执行)─────────────
      # 为什么必须这一步:job 日志与 artifacts 下载**都要认证**(实测
      # `GET /actions/runs/<id>/logs` = 403、artifacts = 401),而 check-run
      # **annotations 公开可读** ⇒ 注解是唯一无需凭证的诊断通道。
      # 为什么 Vitest 的 github-actions reporter 不够:它只覆盖**逐用例失败**
      # (已本地实证:`CI=true` 下产出 `::error file=…,line=…`;无 CI 零输出)。
      # 而**套件级失败**(transform / 导入收集 / worker 崩溃 / 无失败用例的非零
      # 退出)不产出任何注解 —— run 37 的 `packages/vm-ui` 红即属此类:
      # 注解仅 3 条(全是旧形态),**零逐用例注解本身就是证据**。
      # 本步补齐该缺口:把日志里最有信息量的行提升为注解。
      # 注:`%` 必须转义为 `%25`,`\n` 以 `%0A` 串联(workflow command 语法)。
      - name: 失败摘要 → 注解(免凭证可读;失败才执行)
        if: failure()
        run: |
          log=.tmp/ts-gate.log
          if [ ! -f "$log" ]; then
            echo "::error::ts-gate 日志缺失(前序步骤未产出 .tmp/ts-gate.log)"
            exit 0
          fi
          echo "::error::ts-gate 关键失败行::$(grep -nE 'FAIL|failed|Error|error TS|Transform|Cannot find|exited \(1\)|worker' "$log" | tail -n 12 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::error::ts-gate 日志尾部 5000 字节::$(tail -c 5000 "$log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - name: ESLint + 依赖边界(dependency-cruiser)+ 必触发反例自检(WP-1)
        run: |
          pnpm lint
          pnpm lint:deps
          pnpm lint:deps:self-test
      - name: ZR-B3 / ZR-B9 隔离扫描(TS 构建图与浏览器产物不含引擎代码与 Rust 产物)
        run: pnpm scan:public
      - name: golden fixture 摘要清单防漂移(stackmaster-canonical-json/1)
        run: pnpm fixtures:manifest --check

  compose-integration:
    name: Compose 集成测试(全拓扑 + 跨域载荷机检;质量门禁 7 阶段三子集,WP-7)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖(frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 构建 TS 工作区(套件消费 workspace 产物;与 ts-gate 并行,重复构建换取 job 独立性)
        run: |
          pnpm --filter @stackmaster/session-api... run build
          pnpm --filter @stackmaster/verifier... run build
      # ZR-B9 / ZR-B10 / ZR-B5 / ZR-B4 / B1 / B6:跨域载荷机检扫描器的规则
      # 精度与必触发红灯反例(单测面;ts-gate 亦有,此处就近承载一份门禁锚)。
      # ZR-B12 / ZR-B13(WP-44):调试通道帧语料包含性 + 变体派生复算单测面
      # (同目录 test/scan,同一步骤承载;集成层走 SESSION_API_IT 门控,不在 CI)。
      - name: ZR-B9 / ZR-B10 / ZR-B5 / ZR-B4 / ZR-B12 / ZR-B13 扫描器规则与红灯反例(单测面)
        run: pnpm --filter @stackmaster/session-api exec vitest run test/scan
      # 完整 linux 拓扑:PostgreSQL + Redis + MinIO + session-api + vm-worker
      # (worker 为 linux 二进制,Rust 阶段容器内构建;CI 取 release profile,
      # 本地默认 debug——D-API-63)。
      - name: 全拓扑构建与启动(PostgreSQL + Redis + MinIO + session-api + vm-worker)
        run: pnpm --filter @stackmaster/session-api compose:app:up
        env:
          WORKER_CARGO_PROFILE: release
      - name: Compose 集成套件(全链路 + 跨域载荷机检零命中 + 编排器重启恢复)
        run: pnpm --filter @stackmaster/session-api test:compose
        env:
          SESSION_API_TOPOLOGY: container
          WORKER_CARGO_PROFILE: release
      - name: 拓扑收尾(down -v;失败也执行,不掩盖测试结果)
        if: always()
        run: pnpm --filter @stackmaster/session-api compose:app:down
        env:
          WORKER_CARGO_PROFILE: release

  e2e-matrix:
    name: E2E 三浏览器矩阵 + axe 三预设真机门禁(WP-74;E-3)
    runs-on: ubuntu-latest
    # ── timeout-minutes 登记(WP-74 要求明确登记)───────────────────────────────
    # 本 job 含**两次** Playwright 调用(矩阵 spec 一次;axe 真机 + reduced-motion
    # 一次),每次各自享有 `playwright.config.ts:33` 的 globalTimeout —— 矩阵形态
    # (E2E_MATRIX=1)为 75 分钟/次,故 Playwright 侧理论最坏 75 + 75 = 150 分钟;
    # 叠加 frozen-lockfile 安装、三浏览器 + 系统依赖下载、compose 冷构建
    # (helpers/compose.ts 的 up -d --build --wait 自身上限 10 分钟)与收尾,
    # 取 180 分钟。普通增量形态远低于此(实测面见 README「门禁形态自查」)。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖(frozen lockfile)
        run: pnpm install --frozen-lockfile
      # 被测产物:vm-ui dist(vite dev 的 publicDir,壳 / 嵌入面都加载它)、
      # web-component 自包含产物(plugin-site-server 承载的插件文档页 +
      # /pwn-memory-vm.js)、session-api dist(global-setup 的题目登记走真实
      # registrar,依赖该产物)。`--filter X...` 含依赖 ⇒ protocol / vm-ui 一并构建。
      - name: 构建被测产物(vm-ui / web-component 自包含产物 + session-api dist)
        run: |
          pnpm --filter @stackmaster/web-component... run build
          pnpm --filter @stackmaster/session-api... run build
      # linux runner 上补齐三引擎与其系统依赖(本地已装;CI 每次全新)。
      - name: Playwright 三浏览器 chromium + firefox + webkit(含系统依赖)
        run: pnpm --filter @stackmaster/plugin-dev exec playwright install --with-deps chromium firefox webkit
      # ── 步骤 1:矩阵 spec(三引擎)────────────────────────────────────────────
      # 并行 / 串行边界登记(拓扑单例 ⇒ 矩阵 spec 内串行):
      #  - compose 全拓扑为**单例**(固定端口 5173/5174/5175/13000,docker compose
      #    工程名固定)⇒ 同一时刻只允许一个 Playwright 进程持有拓扑;
      #  - `playwright.config.ts` 的 workers: 1 / fullyParallel: false(真实后端
      #    共享单拓扑,会话并发预算 D-API-50)⇒ **spec 内用例串行**;矩阵 12 格
      #    (六宽度 × 两面)在 chromium / firefox / webkit 三项目间亦串行,另 5 个
      #    chromium 口径附加格(主题 / 键盘 / reduced-motion / 高对比度 / 非根路径);
      #  - **job 之间**:本 job 占满拓扑,不得与任何其它 E2E job 并行(现无第二个;
      #    若将来新增,须串行化或改用独立端口与独立 compose 工程名);
      #  - **O-MP-2(中期任务分解 §七)口径**:chromium + firefox + webkit 三引擎
      #    常态跑,webkit 允许 retry 一次 —— 由 `playwright.config.ts:30` 的
      #    CI 形态 `retries: 1` 承载(GitHub 自动注入 CI=true),本 job 不再叠加;
      #  - 本步 E2E_KEEP_COMPOSE=1:保留拓扑给下一步(避免第二次冷构建),
      #    收尾由本 job 末尾的 `if: always()` 步骤显式执行。
      #  - `--reporter=…,github`(2026-09-17 补)是**可诊断性**要求,不是装饰:
      #    `list` 只写控制台、`json` 只落文件 —— 两者都**不产生 check-run
      #    annotations**,而 GitHub 的 job 日志下载与 artifacts 下载**都要认证**
      #    (实测 `GET /actions/runs/<id>/logs` = 403 Must have admin rights、
      #    artifacts = 401)。后果:CI 上矩阵红成 `Process completed with exit
      #    code 1` 一句,谁都无法在不登录的前提下知道**哪个用例**红了。
      #    `github` reporter 为每个失败用例发 `::error file=…,line=…::标题`,
      #    而 **annotations 是公开可读的**(`GET /check-runs/<job_id>/annotations`)
      #    ⇒ 无凭证也能逐条定位。**请勿移除本 reporter**;若注解数量被 GitHub
      #    截断,仍足以看到首批失败用例。
      - name: 矩阵 spec(chromium + firefox + webkit;E2E_MATRIX=1)
        run: pnpm --filter @stackmaster/plugin-dev exec playwright test e2e/browser-matrix.spec.ts --reporter=list,json,github
        env:
          E2E_MATRIX: "1"
          # 拓扑保留给下一步(步骤 2 在其上复跑;末尾统一下线)。
          E2E_KEEP_COMPOSE: "1"
          # 凭证只经环境变量(compose dev 拓扑的合成开发值,仓库内公开常量:
          # apps/session-api/compose/app.yaml:72;生产形态由部署注入真实值)。
          SESSION_API_HOST_BACKEND_TOKEN: host-backend-shared-credential-0123456789
          WORKER_CARGO_PROFILE: release
          # 矩阵报告落 .tmp/(仓库 .gitignore 覆盖),供 artifacts 归档。
          PLAYWRIGHT_JSON_OUTPUT_NAME: .tmp/e2e-matrix-report.json
      # ── 步骤 2:axe 三预设真机门禁 + reduced-motion(chromium 门禁口径)─────
      # axe / reduced-motion 两个 spec 自身 skip 非 chromium 项目(browserName 断言),
      # 此处再显式 --project=chromium:门禁口径不变,且不随 E2E_MATRIX 膨胀。
      # 拓扑已在跑 ⇒ global-setup 的 readyz 探测直接复用(不再 compose:app:up)。
      - name: axe 三预设真机门禁 + reduced-motion(chromium)
        run: pnpm --filter @stackmaster/plugin-dev exec playwright test e2e/axe-contrast.spec.ts e2e/reduced-motion.spec.ts --project=chromium --reporter=list,github
        env:
          E2E_KEEP_COMPOSE: "1"
          SESSION_API_HOST_BACKEND_TOKEN: host-backend-shared-credential-0123456789
          WORKER_CARGO_PROFILE: release
      # ── 归档 artifacts(axe JSON 归档 + 矩阵报告 + 失败 trace;失败也执行)──
      - name: 归档 artifacts(axe 归档 + 矩阵报告 + 失败 trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-matrix-artifacts
          if-no-files-found: warn
          # axe 归档目录按**运行当日**生成(见 e2e/axe-contrast.spec.ts);CI 只归档
          # 不提交 —— 落仓归档由本地 / 主控波次执行(归档即历史证据)。
          path: |
            apps/plugin-dev/e2e/reports/axe/**
            apps/plugin-dev/.tmp/e2e-matrix-report.json
            apps/plugin-dev/.tmp/playwright-artifacts/**
      - name: 拓扑收尾(compose:app:down;失败也执行,不掩盖测试结果)
        if: always()
        run: pnpm --filter @stackmaster/session-api compose:app:down
        env:
          WORKER_CARGO_PROFILE: release

  rust-gate:
    name: vm-engine 确定性纪律与测试(ENG-1 ~ ENG-7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vm-engine
            tooling/contract-smoke
      # 与 turbo 任务 lint:rust(pnpm lint:rust → turbo run lint:rust)是同一脚本;
      # rust-gate 不安装 node 依赖,直调脚本以解除对 npm registry 的依赖。
      - name: ENG-1 ~ ENG-6 纪律门禁 + fmt + clippy(-D warnings)+ 必触发反例自检
        run: node tooling/check-engine-discipline.mjs
      - name: ENG-3 运行时反例 + ENG-6 测试(dev + release;release 验证 overflow-checks)
        run: pnpm test:rust
      - name: ENG-7 覆盖率门槛(vm-core / vm-runtime / projection ≥ 90%)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov --fail-under-lines 90(门槛对象为引擎三 crate,排除进程边界二进制)
        run: cargo llvm-cov --workspace --exclude vm-worker --fail-under-lines 90
        working-directory: vm-engine
      - name: contract-smoke 测试与跨语言契约冒烟(阶段一移交项)
        run: |
          cargo test --manifest-path tooling/contract-smoke/Cargo.toml
          pnpm smoke:contract

  rust-miri:
    name: cargo miri(vm-core 无未定义行为;ENG-8,WP-9)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vm-engine
          cache-all-crates: true
      # 范围收敛(2026-09-09,理由与耗时实测登记于 ENG-8 映射文档 v1.3):
      # vm-core 为 #![forbid(unsafe_code)](ENG-1),Miri 的增量价值在 UB / 数值
      # 敏感面——arch 掩蔽算术 / decode 译码边界 / memory 页与 COW / state
      # 快照克隆 / registers / judge::predicate 条件求值;exec / instr / judge
      # 行为面由原生测试 job(pnpm test:rust)全量覆盖。nightly 每日轮换令
      # rust-cache 与 Miri sysroot(~/.cache/miri,不在 rust-cache 覆盖内)每日
      # 冷重建,全量 167 测试解释执行在 CI 逼近 60 分钟超时(暖缓存实测:
      # 全量 >40 分钟未完,过滤集 80 测试 6.3 分钟)。唯一 skip 的
      # constant_cost_predicate_count_under_mutation 为手写 256 轮 × 整引擎
      # 重建循环(Miri 下 >30 分钟),其不变式由同模块 miri 缩减用例的
      # proptest 覆盖,原生 job 仍全量执行;本地全量入口保留 pnpm test:miri。
      - name: cargo +nightly miri test -p vm-core UB 敏感面子集(13.1:VM Core 无未定义行为)
        run: 'cargo +nightly miri test -p vm-core -- arch:: decode:: memory:: state:: registers:: judge::predicate:: --skip constant_cost_predicate_count_under_mutation'
        working-directory: vm-engine

  rust-fuzz:
    name: cargo-fuzz 解析器模糊测试(ENG-9,WP-9)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # 显式 gnu 目标:cargo-fuzz 0.13+ 在 linux 默认改用 x86_64-unknown-linux-musl,
      # 而 musl std 未随 minimal 工具链安装,且 musl 默认 crt-static 与
      # -Zsanitizer=address 不兼容(sanitizer 要求动态链接 libc)。gnu 是宿主
      # 工具链自带的 std,ASAN 开箱可用,亦与各 fuzz 步骤名/文档锚点解耦。
      - name: fuzz frame_command(动作 / 命令解析器;13.1"fuzz 无 panic")
        run: cargo fuzz run frame_command --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
      - name: fuzz challenge_bundle(题目包 + IR 装配解析器)
        run: cargo fuzz run challenge_bundle --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
      - name: fuzz byte_decode(字节模式取指译码器,gadget 路径)
        run: cargo fuzz run byte_decode --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
      - name: fuzz action_log_parse(规范化动作日志解析面;阶段六 WP-61)
        run: cargo fuzz run action_log_parse --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
