name: CI

# 阶段二 WP-0:TS 门禁 + vm-engine 确定性纪律门禁(阶段一移交项接线)。
# 步骤名携带《数据分类与秘密零驻留清单》条目 ID(扫描器纪律,§九);
# 条目 → CI 检查项映射:docs/develop/秘密零驻留CI检查项映射.md。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-gate:
    name: TS 构建图与契约门禁(ZR-B3 / ZR-B9 隔离扫描)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖(frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 构建 + 类型检查 + 测试(turbo)
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
      - name: ESLint + 依赖边界(dependency-cruiser)+ 必触发反例自检(WP-1)
        run: |
          pnpm lint
          pnpm lint:deps
          pnpm lint:deps:self-test
      - name: ZR-B3 / ZR-B9 隔离扫描(TS 构建图与浏览器产物不含引擎代码与 Rust 产物)
        run: pnpm scan:public
      - name: golden fixture 摘要清单防漂移(stackmaster-canonical-json/1)
        run: pnpm fixtures:manifest --check

  compose-integration:
    name: Compose 集成测试(全拓扑 + 跨域载荷机检;质量门禁 7 阶段三子集,WP-7)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖(frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 构建 TS 工作区(套件消费 workspace 产物;与 ts-gate 并行,重复构建换取 job 独立性)
        run: pnpm --filter @stackmaster/session-api... run build
      # ZR-B9 / ZR-B10 / ZR-B5 / ZR-B4 / B1 / B6:跨域载荷机检扫描器的规则
      # 精度与必触发红灯反例(单测面;ts-gate 亦有,此处就近承载一份门禁锚)。
      # ZR-B12 / ZR-B13(WP-44):调试通道帧语料包含性 + 变体派生复算单测面
      # (同目录 test/scan,同一步骤承载;集成层走 SESSION_API_IT 门控,不在 CI)。
      - name: ZR-B9 / ZR-B10 / ZR-B5 / ZR-B4 / ZR-B12 / ZR-B13 扫描器规则与红灯反例(单测面)
        run: pnpm --filter @stackmaster/session-api exec vitest run test/scan
      # 完整 linux 拓扑:PostgreSQL + Redis + MinIO + session-api + vm-worker
      # (worker 为 linux 二进制,Rust 阶段容器内构建;CI 取 release profile,
      # 本地默认 debug——D-API-63)。
      - name: 全拓扑构建与启动(PostgreSQL + Redis + MinIO + session-api + vm-worker)
        run: pnpm --filter @stackmaster/session-api compose:app:up
        env:
          WORKER_CARGO_PROFILE: release
      - name: Compose 集成套件(全链路 + 跨域载荷机检零命中 + 编排器重启恢复)
        run: pnpm --filter @stackmaster/session-api test:compose
        env:
          SESSION_API_TOPOLOGY: container
          WORKER_CARGO_PROFILE: release
      - name: 拓扑收尾(down -v;失败也执行,不掩盖测试结果)
        if: always()
        run: pnpm --filter @stackmaster/session-api compose:app:down
        env:
          WORKER_CARGO_PROFILE: release

  rust-gate:
    name: vm-engine 确定性纪律与测试(ENG-1 ~ ENG-7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vm-engine
            tooling/contract-smoke
      # 与 turbo 任务 lint:rust(pnpm lint:rust → turbo run lint:rust)是同一脚本;
      # rust-gate 不安装 node 依赖,直调脚本以解除对 npm registry 的依赖。
      - name: ENG-1 ~ ENG-6 纪律门禁 + fmt + clippy(-D warnings)+ 必触发反例自检
        run: node tooling/check-engine-discipline.mjs
      - name: ENG-3 运行时反例 + ENG-6 测试(dev + release;release 验证 overflow-checks)
        run: pnpm test:rust
      - name: ENG-7 覆盖率门槛(vm-core / vm-runtime / projection ≥ 90%)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov --fail-under-lines 90(门槛对象为引擎三 crate,排除进程边界二进制)
        run: cargo llvm-cov --workspace --exclude vm-worker --fail-under-lines 90
        working-directory: vm-engine
      - name: contract-smoke 测试与跨语言契约冒烟(阶段一移交项)
        run: |
          cargo test --manifest-path tooling/contract-smoke/Cargo.toml
          pnpm smoke:contract

  rust-miri:
    name: cargo miri(vm-core 无未定义行为;ENG-8,WP-9)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vm-engine
          cache-all-crates: true
      # 范围收敛(2026-09-09,理由与耗时实测登记于 ENG-8 映射文档 v1.3):
      # vm-core 为 #![forbid(unsafe_code)](ENG-1),Miri 的增量价值在 UB / 数值
      # 敏感面——arch 掩蔽算术 / decode 译码边界 / memory 页与 COW / state
      # 快照克隆 / registers / judge::predicate 条件求值;exec / instr / judge
      # 行为面由原生测试 job(pnpm test:rust)全量覆盖。nightly 每日轮换令
      # rust-cache 与 Miri sysroot(~/.cache/miri,不在 rust-cache 覆盖内)每日
      # 冷重建,全量 167 测试解释执行在 CI 逼近 60 分钟超时(暖缓存实测:
      # 全量 >40 分钟未完,过滤集 80 测试 6.3 分钟)。唯一 skip 的
      # constant_cost_predicate_count_under_mutation 为手写 256 轮 × 整引擎
      # 重建循环(Miri 下 >30 分钟),其不变式由同模块 miri 缩减用例的
      # proptest 覆盖,原生 job 仍全量执行;本地全量入口保留 pnpm test:miri。
      - name: cargo +nightly miri test -p vm-core UB 敏感面子集(13.1:VM Core 无未定义行为)
        run: 'cargo +nightly miri test -p vm-core -- arch:: decode:: memory:: state:: registers:: judge::predicate:: --skip constant_cost_predicate_count_under_mutation'
        working-directory: vm-engine

  rust-fuzz:
    name: cargo-fuzz 解析器模糊测试(ENG-9,WP-9)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # 显式 gnu 目标:cargo-fuzz 0.13+ 在 linux 默认改用 x86_64-unknown-linux-musl,
      # 而 musl std 未随 minimal 工具链安装,且 musl 默认 crt-static 与
      # -Zsanitizer=address 不兼容(sanitizer 要求动态链接 libc)。gnu 是宿主
      # 工具链自带的 std,ASAN 开箱可用,亦与各 fuzz 步骤名/文档锚点解耦。
      - name: fuzz frame_command(动作 / 命令解析器;13.1"fuzz 无 panic")
        run: cargo fuzz run frame_command --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
      - name: fuzz challenge_bundle(题目包 + IR 装配解析器)
        run: cargo fuzz run challenge_bundle --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
      - name: fuzz byte_decode(字节模式取指译码器,gadget 路径)
        run: cargo fuzz run byte_decode --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=16384
        working-directory: vm-engine
