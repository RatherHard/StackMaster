<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>握手桩插件页(WP-51 联调桩,非交付物)</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: system-ui 0.875rem sans-serif; margin: 0; padding: 1rem; }
      h1 { font-size: 1rem; margin: 0 0 0.5rem; }
      .badge { background: rgb(200 120 0 / 15%); border: 1px solid rgb(200 120 0 / 50%); border-radius: 6px; display: inline-block; font-size: 0.75rem; margin-block-end: 0.75rem; padding: 0.125rem 0.5rem; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 0.75rem; font-size: 0.8125rem; margin: 0; }
      dt { color: graytext; }
      dd { margin: 0; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">联调桩(非交付物)——只实现 hello / ready 协议侧;正式插件 Shell 归 WP-52</span>
      <h1>握手桩插件页</h1>
      <dl>
        <dt>esid(fragment)</dt><dd id="esid">—</dd>
        <dt>协议状态</dt><dd id="proto-state">初始化</dd>
        <dt>hello 已发 / 重试</dt><dd id="hello-count">0 / 上限 3</dd>
        <dt>ready.config</dt><dd id="config">—</dd>
        <dt>引导配置(通道 a)</dt><dd id="bootstrap">未取回</dd>
        <dt>port 凭证(通道 b)</dt><dd id="port-state">未转移</dd>
        <dt>最近宿主消息</dt><dd id="last-message">—</dd>
      </dl>
    </main>
    <script type="module" src="/host-mock/stub-plugin.js"></script>
  </body>
</html>
