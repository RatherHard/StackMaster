# 人工走查演示拓扑 override(阶段四直观验收;与 compose:app:up 叠加使用):
#
#   docker compose -f compose/deps.yaml -f compose/app.yaml -f compose/demo-override.yaml up -d
#
# ── WP-96 改述(退役面登记,勿据旧注释行事)───────────────────────────────
# 本文件历史上做的一件事是:**把浏览器侧开发壳的 origin 补进 CSRF/凭证白名单**
# (`http://localhost:5173` 宿主模拟页;阶段五 WP-52 增补 `http://localhost:5174`
# 插件独立来源,`plugin-site-server` 承载)。那两个应用(`apps/plugin-dev`)随
# 嵌入协议面**整体退役并已物理删除**(D-LT-1 / WP-96)⇒ 这两条 origin 已无任何
# 服务承载,继续登记只会留下"看起来还能用"的死面。
#
# **页面分发形态是「与 API 同源」**(改版 §五 第 ① 项):学习者打开
# `{SESSION_API_PUBLIC_ORIGIN}/app/c/:id/:version?t=<票>`,换票 302 后页面与
# `/sessions` / `/auth` / `/descriptors` **同域** ⇒ **不需要任何额外 origin**,
# 同源约束与 `SameSite=Strict` 的凭证呈递由 compose/app.yaml 的
# `SESSION_API_PUBLIC_ORIGIN` + `SESSION_API_ALLOWED_ORIGINS`(同一个字面 origin)
# 承担。故本 override 现在只把**页面 origin**显式钉一遍(与 app.yaml 同值;多文件
# merge 语义 = 同键后者胜,便于走查时一眼看到浏览器 origin 是什么)。
#
# 人工走查步骤(WP-96):
#  ① 构建页面产物:`pnpm --filter @stackmaster/vm-ui build &&
#     pnpm --filter @stackmaster/page-app build`(app.yaml 已把它挂进容器);
#  ② 登记题目:`node apps/session-api/k6/seed-challenge.mjs`(登记租户 = app.yaml 的
#     `SESSION_API_HOST_TENANTS` 锚租户);
#  ③ 领启动地址:`curl.exe -X POST http://127.0.0.1:13000/auth/launch-tickets
#     -H "authorization: Bearer <宿主凭证>" -H 'content-type: application/json'
#     -d '{"challengeId":"chal-k6-baseline","version":"1.0.0"}'`;
#  ④ 把 `launchUrl` 贴进浏览器(localhost 与 127.0.0.1 不同源 ⇒ 用哪一个都行,
#     但必须与该键的值一致)。
services:
  session-api:
    environment:
      SESSION_API_PUBLIC_ORIGIN: "http://127.0.0.1:13000"
      SESSION_API_ALLOWED_ORIGINS: "http://127.0.0.1:13000"
