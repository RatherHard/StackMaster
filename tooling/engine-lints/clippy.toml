# 引擎三 crate(vm-core / vm-runtime / projection)确定性纪律的 clippy 禁用清单(ENG-5)。
#
# 结构性主防线是各 crate 的 #![no_std](std::time / std::io / std::net / std::fs
# 在引擎 crate 内不可解析,ENG-2);本清单是第二层 lint:对"漏掉 no_std 的回归"
# 给出 clippy 红灯,并兜底 rand 等时间 / 随机源入口(时钟与随机源必须由
# trait 注入,实现归 vm-worker 进程层——ADR-8、CLAUDE.md "Rust 引擎纪律")。
#
# 应用方式:tooling/check-engine-discipline.mjs 以 CLIPPY_CONF_DIR 指向本目录,
# 对引擎三 crate 运行 cargo clippy(-D warnings);vm-worker 是进程边界层,
# 合法使用 std::io / 时钟 / 随机源,不适用本清单。
# 反例(必触发):check-engine-discipline.mjs 的 clippy 反例 crate 自检。
#
# 清单为"尽力枚举"(disallowed-* 不支持通配);结构性保证以 no_std 为准。
disallowed-types = [
  "std::time::Instant",
  "std::time::SystemTime",
  "std::net::TcpStream",
  "std::net::TcpListener",
  "std::net::UdpSocket",
  "std::fs::File",
  "std::io::BufReader",
  "std::io::BufWriter",
  "std::process::Child",
  "std::process::Command",
]
disallowed-methods = [
  "std::time::Instant::now",
  "std::time::SystemTime::now",
  "std::thread::sleep",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::fs::create_dir",
  "std::fs::remove_file",
  "std::net::TcpStream::connect",
  "std::net::TcpListener::bind",
  "std::net::UdpSocket::bind",
  "std::process::Command::new",
]
